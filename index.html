<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Website</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(135deg, #fce4ec 0%, #e3f2fd 100%);
        color: #5a4a5a;
        min-height: 100vh;
        padding: 20px;
    }

    .container {
        max-width: 820px;
        margin: 0 auto;
    }

    h1 {
        text-align: center;
        color: #ad1457;
        margin-bottom: 6px;
        font-weight: 600;
    }

    .subtitle {
        text-align: center;
        color: #7e57c2;
        margin-bottom: 24px;
        font-size: 15px;
    }

    .tabs {
        text-align: center;
        color: #7e57c2;
        margin-bottom: 24px;
        font-size: 15px;
    }

    .tab {
        padding: 10px 18px;
        border-radius: 20px;
        border: 1px solid #f8bbd9;
        background: rgba(255,255,255,0.7);
        color: #ad1457;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s;
    }

    .tab:hover { background: #f8bbd9; }
    .tab.active {
        background: #f48fb1;
        color: white;
        border-color: #f48fb1;
    }

    .panel {
        display: none;
        background: rgba(255,255,255,0.9);
        border-radius: 16px;
        padding: 22px;
        border: 1px solid #e1bee7;
        box-shadow: 0 6px 18px rgba(179,157,219,0.15);
    }

    .panel.active {display: block; }

    h2 {
        color: #7e57c2;
        margin-bottom: 14px;
        font-size: 18px;
    }

    input, textarea, select, button {
        font-family: inherit;
        border-radius: 8px;
        border: 1px solid #f8bbd9;
        padding: 8px 12px;
        background: white;
        color: #5a4a5a;
    }

    input:focus, textarea:focus {
        outline: none;
        border-color: #90caf9;
        box-shadow: 0 0 0 3px rgba(144, 202, 249, 0.3)
    }

    button {
        cursor: pointer;
        background: #fce4ec;
        color: #ad1457;
        transition: all 0.15s;
    }

    button:hover {
        background: #f8bbd9;
        color: #880e4f;
    }

    .primary-btn {
        background: #f48fb1;
        color: white;
        border-color: #f48fb1;
    }

    .primary-btn:hover {
        background: #ec407a;
    }

    .quiz-form { margin-bottom: 18px; }
    .quiz-form input { width: 100%; margin-bottom: 8px; }

    .question-card {
        background: #fce4ec;
        padding: 12px 14px;
        border-radius: 10px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .quiz-area { margin-top: 16px; }

    .score {
        text-align: center;
        font-size: 18px;
        color: #7e57c2;
        margin: 16px 0;
    }

    .memory-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 12px;
        margin-top: 16px;
    }

    .card {
        height: 90px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 14px;
        text-align: center;
        padding: 8px;
        transition: all 0.25s;
        user-select: none;
    }

    .card.back {
        background: linear-gradient(135deg, #f8bbd9, #90caf9);
        color: white;
        font-weight: 600;
    }

    .card.front {
        background: white;
        border: 2px solid #ce93d8;
        color: #5a4a5a;
    }

    .card.matched {
        opacity: 0.4;
        pointer-events: none;
    }

    .typing-box{
        background: #f3e5f5;
        padding: 16px;
        border-radius: 12px;
        margin-bottom: 14px;
        line-height: 1.6;
        min-height: 80px;
    }

    #typingInput {
        width: 100%;
        height: 100px;
        resize: vertical;
        margin-bottom: 10px;
    }

    typing-stats {
        display: flex;
        gap: 20px;
        margin-top: 10px;
        color: #7e57c2;
    }

    .spinner-container {
        text-align: center;
        margin: 20px 0;
    }

    .wheel {
        width: 220px;
        height: 220px;
        border-radius: 50%;
        margin: 0 auto 20px;
        border: 8px solid #f8bbd9;
        position: relative;
        overflow: hidden;
        transition: transform 4s cubic-bezier(0.2, 0.8, 0.3, 1);
    }

    .wheel-inner {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: conic-gradient(
            #f48fb1 0deg 90deg,
            #90caf9 90deg 190deg,
            #ce93d8 180deg 270deg,
            #80deea 280deg 360deg
        );
    }

    .pointer {
        width: 0;
        height: 0;
        border-left: 12px solid transparent;
        border-right: 12px solid transparent;
        border-bottom: 20px solid #ad1457;
        margin: 0 auto 8px;
    }

    .result {
        font-size: 20px;
        color: #ad1457;
        font-weight: 600;
        margin-top: 12px;
        min-height: 30px;
    }

    .topic-tag {
        background: #e1bee7;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .topic-tag button {
        background: none;
        border: none;
        color: #ad1457;
        font-size: 14px;
        padding: 0;
    }

    .empty-msg {
        text-align: center;
        color: #9c27b0;
        padding: 20px;
        font-size: 15px;
    }
</style>
</head>
<body>
<div class="container">
    <h1>Study Lab</h1>
    <p class=""subtitle">A great place to study for subjects</p>
    <div class="tabs">
        <button class="tab active" onclick="showPanel('quiz')">Quiz</button>
        <button class="tab" onclick="showPanel('memory')">Memory Cards</button>
</div>


</html>
